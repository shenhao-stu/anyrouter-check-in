name: Debug agentrouter (manual)
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    environment: production
    env:
      PYTHONIOENCODING: utf-8
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 安装依赖
      run: |
        pip install -q playwright httpx
        playwright install chromium --with-deps > /dev/null 2>&1
        sudo apt-get install -y -qq xvfb

    - name: 探测 agentrouter 页面状态
      env:
        DEBUG_ACCOUNT: ${{ secrets.ANYROUTER_ACCOUNT_92447_AGENTROUTER }}
      run: |
        Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp -ac &
        sleep 1
        DISPLAY=:99 python3 debug_agentrouter.py

    - name: 上传截图
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: debug-shots
        path: debug_shots/
        if-no-files-found: ignore
